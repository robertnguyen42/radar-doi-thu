name: Radar tuần
on:
  schedule:
    - cron: "0 0 * * 1"   # Thứ Hai 07:00 giờ VN
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q anthropic pydantic
      - run: python fetch.py
      - run: python analyze_ai.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: python build.py
      - name: Commit
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data dist
          git diff --cached --quiet || git commit -m "Radar tuần $(date -u +%G-W%V)"
          git push

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar Đối thủ Định cư</title>
<style>
/* Giao diện theo Bản tin Di trú: thanh trên + cột lọc trái + nội dung phải. 4Ps giữ 4 màu "mực dấu visa". */
:root{--bg:#f5f6f8;--surface:#fff;--sunk:#eef1f5;--line:#e3e6eb;--fg:#16191f;--muted:#5f6b7a;--accent:#1d4ed8;--accent-soft:#e8eefc;
  --p-product:#1d4ed8;--p-price:#047857;--p-place:#8a5a00;--p-promo:#a3306b;
  --warn:#b91c1c;--warn-soft:#fde8e8;--self:#047857;--self-soft:#e3f4ec;--new:#dc2626;--heat:29,78,216;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--s0:#b9b8b2;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;--f-mono:var(--f-body)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--surface:#171a21;--sunk:#1f2430;--line:#2a2f3a;--fg:#e6e8ec;--muted:#9aa4b2;
  --accent:#7aa2ff;--accent-soft:#1c2740;--p-product:#7aa2ff;--p-price:#10b981;--p-place:#e0b049;--p-promo:#e48ab8;
  --warn:#ef4444;--warn-soft:#3a1f20;--self:#10b981;--self-soft:#163329;--new:#ef4444;--heat:122,162,255;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;--s0:#5c5b57;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1115;--surface:#171a21;--sunk:#1f2430;--line:#2a2f3a;--fg:#e6e8ec;--muted:#9aa4b2;
  --accent:#7aa2ff;--accent-soft:#1c2740;--p-product:#7aa2ff;--p-price:#10b981;--p-place:#e0b049;--p-promo:#e48ab8;
  --warn:#ef4444;--warn-soft:#3a1f20;--self:#10b981;--self-soft:#163329;--new:#ef4444;--heat:122,162,255;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;--s0:#5c5b57;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
td.n,th.n,.v,.big,.delta,.eng,.amt,.pk{font-variant-numeric:tabular-nums}
/* Thanh trên */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-size:18px;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:#16a34a;flex:none}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:9px 14px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.p4legend{display:flex;gap:6px}
.fbtn{display:none;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
/* Khung chính */
.wrap{max-width:1320px;margin:0 auto;padding:16px;display:grid;grid-template-columns:268px minmax(0,1fr);gap:20px;align-items:start}
main{display:grid;gap:16px;min-width:0}
/* Cột trái */
.side{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 0 10px}
.side-head{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 4px}
.side-head b{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 0;font-size:13px}
.facet{border-top:1px solid var(--line);padding:10px 14px 8px}
.facet:first-of-type{border-top:0}
.facet h3{margin:0 0 6px;font-size:13px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--fg)}
.opt{display:flex;align-items:center;gap:8px;padding:4px 6px;margin:0 -6px;border-radius:6px;cursor:pointer;font-size:13.5px;width:calc(100% + 12px);border:0;background:none;text-align:left}
.opt:hover{background:var(--sunk)}

.opt.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.opt.on .n{color:var(--accent)}
.hint{color:var(--muted);font-size:12px;margin:2px 0 0}
.scrim{display:none}
/* Danh sách bài kiểu bản tin */
.res-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.res-head .count{font-size:15px;font-weight:700;margin-right:4px}
.fchip2{display:inline-flex;align-items:center;gap:4px;padding:3px 6px 3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;border:0;cursor:pointer}
.fchip2 span{font-size:15px;line-height:1;padding:0 3px}
.week{margin:0 0 6px}
.week h2{display:flex;align-items:baseline;gap:8px;font-size:14px;border-bottom:2px solid var(--line);padding-bottom:6px;margin:0 0 12px}
.week h2 .wn{color:var(--muted);font-weight:500;font-size:12.5px}
.feed{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item:hover{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
.item.self{box-shadow:inset 3px 0 0 var(--self)}

.item a.t{color:var(--fg);text-decoration:none;font-weight:600;font-size:14.5px;line-height:1.4}

.imeta{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.grp{color:var(--accent);font-weight:600}
.b{border-radius:4px;padding:0 6px;font-weight:700;font-size:11.5px;line-height:18px}
.b.new{background:var(--new);color:#fff}
.loadmore{display:block;width:100%;margin:4px 0 8px;padding:10px;border:1px dashed var(--line);background:transparent;border-radius:10px;cursor:pointer;color:var(--muted)}
.loadmore:hover{color:var(--accent);border-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.self td{background:var(--self-soft)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.name{font-weight:600;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);white-space:nowrap;margin:1px 2px 1px 0}

.s-product{color:var(--p-product)} .s-price{color:var(--p-price)} .s-place{color:var(--p-place)} .s-promotion{color:var(--p-promo)}
.p4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.pcard{--p:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-rows:auto 1fr;min-width:0;overflow:hidden}

.phead .pk b{color:var(--p);font-size:18px;font-weight:600;display:block;line-height:1.1}
.pbody{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:14px 16px 16px;align-content:start}
.pbody > div{display:grid;gap:8px;align-content:start;min-width:0}
.pbody.one{grid-template-columns:1fr}
@media (max-width:520px){.pbody{grid-template-columns:1fr}}
.meter{display:grid;grid-template-columns:minmax(0,1fr) 64px 28px;gap:8px;align-items:center;font-size:13px}
.meter span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .t{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter .t i{display:block;height:100%;background:var(--p);border-radius:3px}

.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px;padding-block:5px;border-bottom:1px dashed var(--line)}
.prow:last-child{border-bottom:0}
.prow .amt{font-family:var(--f-mono);font-weight:600;color:var(--p);white-space:nowrap;font-variant-numeric:tabular-nums}

.more{font-size:11.5px;color:var(--muted)}
.filter{display:grid;gap:10px}
.filter input[type=search]{font:inherit;width:100%;max-width:420px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.fchip i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.fchip[aria-pressed="true"] i{color:var(--surface)}
.fchip:hover{border-color:var(--accent)}
.fcount{font-size:12px;color:var(--muted)}
.srct{display:inline-block;font-size:10.5px;font-weight:600;padding:0 6px;border-radius:4px;background:var(--sunk);color:var(--muted);margin-right:4px}
.srct.facebook{background:var(--accent-soft);color:var(--accent)}
.eng{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:6px;white-space:nowrap}
.heat td.h{text-align:center;font-family:var(--f-mono);font-size:12px;min-width:44px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 36px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:10px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:grid;gap:2px;min-width:0}
.list a{color:var(--fg);text-decoration:none} .list a:hover{color:var(--accent);text-decoration:underline}
.sub{color:var(--muted);font-size:12px}
.threat{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px}
.threat.cao{background:var(--warn-soft);color:var(--warn)} .threat.trung{background:var(--accent-soft);color:var(--accent)} .threat.thấp{background:var(--sunk);color:var(--muted)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:13px;margin:0}
.kv dt{font-weight:600} .kv dd{margin:0;min-width:0}
ol.actions{margin:0;padding-left:20px;display:grid;gap:10px}
.verdict{background:var(--accent-soft);border-radius:6px;padding:10px 12px;line-height:1.6;max-width:90ch}
select{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{color:var(--muted);font-size:12.5px;max-width:95ch}

.big{font-size:22px;font-weight:700;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.delta{font-family:var(--f-mono);font-size:11.5px}
.up{color:var(--p-price)} .down{color:var(--warn)}


h1{font-size:22px;margin:0}
h2{font-size:16px;margin:0;font-weight:600;text-wrap:balance}
h3{font-size:12px;margin:0;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.name{font-weight:600;white-space:nowrap}
/* Biểu đồ so sánh nội dung: thanh ngang xếp chồng */
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg2{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg2 button{border:0;border-left:1px solid var(--line);background:var(--surface);padding:5px 12px;cursor:pointer;font-size:13px}

.mrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mrow.self .nm{color:var(--self)}
.mrow .tt{color:var(--muted);text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.mbar{display:flex;gap:2px;height:20px;min-width:0}
.mbar i{display:block;height:100%;min-width:2px;cursor:default}
.mbar i:first-child{border-radius:4px 0 0 4px} .mbar i:last-child{border-radius:0 4px 4px 0} .mbar i:only-child{border-radius:4px}

</style>

<header class="top">
 <div class="top-in">
  <button class="fbtn" id="fbtn" aria-controls="side">Mục & lọc</button>
  <div class="brand"><b>Radar Đối thủ Định cư</b><small><span class="dot"></span><span id="meta">Đang tải…</span></small></div>
  <label class="search"><span class="sr">Tìm kiếm</span>
   <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
   <input id="q" type="search" placeholder="Tìm bài, sự kiện có dấu hoặc không dấu: EB-5, Hy Lạp, hoi thao…" autocomplete="off">
  </label>
  <div class="p4legend"><span class="stamp s-product">Product</span><span class="stamp s-price">Price</span><span class="stamp s-place">Place</span><span class="stamp s-promotion">Promotion</span></div>
 </div>
</header>

<div class="wrap">
 <aside class="side" id="side" aria-label="Mục và bộ lọc"></aside>
 <div class="scrim" id="scrim"></div>
 <main id="view" aria-live="polite"></main>
</div>
<p class="note" style="max-width:1320px;margin:0 auto;padding:0 16px 32px">Dữ liệu tự động từ RSS website công ty, fanpage Facebook (bài liên quan định cư), Google News và trang chủ; phân loại bằng từ khoá (sửa trong <code>taxonomy.json</code>). Số liệu là tín hiệu tham khảo, không phải số đếm tuyệt đối.</p>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const C = D.companies, P = D.programs, K = D.countries;
const ids = Object.keys(C);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pn = id => P[id] ? P[id].name : id;
const fmtD = s => s ? s.slice(8,10)+'/'+s.slice(5,7) : '';
const chips = (arr, cls='') => arr && arr.length ? arr.map(x => `<span class="chip ${cls}">${esc(x)}</span>`).join('') : '<span class="empty">—</span>';
{ const u = new Date(D.updated.replace(/\+00:00$/, 'Z')); document.getElementById('meta').textContent = `Tuần ${D.week.split('-W')[1]} · cập nhật ${isNaN(u) ? D.updated.slice(0,16) : u.toLocaleString('vi-VN', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'})} · ${ids.length} công ty · ${D.items.length} bài/90 ngày`; }
let state = {tab:'overview', co: ids.find(i => C[i].self) || ids[0]};
try { const s = JSON.parse(localStorage.getItem('radar') || '{}'); Object.assign(state, s); } catch(e){}
const save = () => { try { localStorage.setItem('radar', JSON.stringify(state)); } catch(e){} };

function delta(cid){
  if (!D.prev || !D.prev[cid]) return '';
  const d = C[cid].posts - D.prev[cid].posts;
  return d ? `<span class="delta ${d>0?'up':'down'}">${d>0?'+':''}${d}</span>` : '';
}
function topCountries(c){
  const cs = c.product.countries, tot = cs.reduce((a,[,n]) => a+n, 0);
  return cs.slice(0,3).map(([k,n]) => `<span class="chip">${K[k].flag} ${esc(K[k].name)} ${Math.round(100*n/tot)}%</span>`).join('') || '<span class="empty">chưa đủ dữ liệu</span>';
}

const AI = D.ai;
const threatCls = t => t === 'cao' ? 'cao' : t === 'thấp' ? 'thấp' : 'trung';
const views = {
ai(){
  if (!AI) return '<p class="empty">Chưa có báo cáo AI.</p>';
  const acts = AI.si_actions.map(a => `<li><b>${esc(a.action)}</b><div>${esc(a.why)}</div><div class="sub">${a.sources.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(C[x.company]?.name || '')}: ${esc(x.title.slice(0,70))}</a>`).join(' · ')}</div></li>`).join('');
  const order = {'cao':0,'trung bình':1,'thấp':2};
  const cos = AI.companies.slice().sort((a,b) => order[a.threat]-order[b.threat]).map(x => `<section class="panel">
    <div class="row"><h2>${esc(C[x.id]?.name || x.id)}</h2><span class="threat ${threatCls(x.threat)}">Cạnh tranh ${esc(x.threat)}</span></div>
    <p style="margin:0">${esc(x.positioning)}</p>
    ${x.this_week ? `<div class="verdict"><b>Tuần này:</b> ${esc(x.this_week)}</div>` : ''}
    <dl class="kv"><dt class="s-product">Product</dt><dd>${esc(x.product)}</dd><dt class="s-price">Price</dt><dd>${esc(x.price)}</dd><dt class="s-place">Place</dt><dd>${esc(x.place)}</dd><dt class="s-promotion">Promotion</dt><dd>${esc(x.promotion)}</dd></dl>
    <p class="sub" style="margin:0">${esc(x.threat_reason)}</p></section>`).join('');
  return `<div style="display:grid;gap:16px">
    <section class="panel"><h3>Tuần ${esc(AI.week)}</h3><h2 style="font-size:19px">${esc(AI.headline)}</h2>
      <h3>Xu hướng thị trường</h3><ul style="margin:0;padding-left:20px;display:grid;gap:4px">${AI.market_trends.map(t => `<li>${esc(t)}</li>`).join('')}</ul></section>
    <section class="panel"><h2>SI nên làm gì</h2><ol class="actions">${acts}</ol></section>
    <div class="grid2">${cos}</div>
    <p class="note">Viết bởi Claude (${esc(AI.model)}) lúc ${esc(AI.generated.replace('T',' '))} UTC từ bài web và tin báo 90 ngày. Kiểm tra lại bài nguồn trước khi dùng con số.</p></div>`;
},
overview(){
  const rows = ids.slice().sort((a,b) => (C[b].self-C[a].self) || (C[b].posts+C[b].news) - (C[a].posts+C[a].news)).map(id => {
    const c = C[id];
    return `<tr class="click ${c.self?'self':''}" data-co="${id}">
      <td class="name">${esc(c.name)} ${c.self?'<span class="chip self">SI</span>':''}</td>
      <td class="n">${c.posts} ${delta(id)}</td><td class="n">${c.posts_7d}</td><td class="n">${c.news}</td><td class="n">${c.fb ? c.fb + (c.fb_7d ? ` <span class="delta up">+${c.fb_7d}</span>` : '') : (c.fb_page ? '0' : '<span class="sub">—</span>')}</td>
      <td>${topCountries(c)}</td>
      <td class="n">${c.promotion.events.length}</td>
      <td>${c.promotion.risks.length ? `<span class="chip warn">⚠ ${c.promotion.risks.length}</span>` : ''}${c.home_ok ? '' : '<span class="chip muted">web chặn</span>'}</td></tr>`;
  }).join('');
  const max = Math.max(1, ...D.trend.map(t => t[1]));
  const trend = D.trend.slice(0,12).map(([p,n]) => `<div class="bar"><span>${K[P[p].country].flag} ${esc(pn(p))}</span><span class="t"><i style="width:${100*n/max}%"></i></span><span class="v">${n}</span></div>`).join('');
  // Ma trận Công ty × Thị trường (số bài nhắc tới)
  const cols = Object.keys(K);
  const cell = (c,k) => { const f = c.product.countries.find(x => x[0]===k); return f ? f[1] : 0; };
  const hmax = Math.max(1, ...ids.flatMap(id => cols.map(k => cell(C[id],k))));
  const heat = ids.map(id => `<tr class="${C[id].self?'self':''}"><td class="name">${esc(C[id].name)}</td>${cols.map(k => { const v = cell(C[id],k); return `<td class="h" style="background:rgba(var(--heat),${v? .12+.7*v/hmax : 0})">${v||''}</td>`; }).join('')}</tr>`).join('');
  return `<div class="grid2" style="grid-template-columns:1fr">
   <section class="panel"><h2>Bảng so sánh</h2>
    <div class="scroll"><table><thead><tr><th>Công ty</th><th class="n">Bài web 90n</th><th class="n">7 ngày</th><th class="n">Tin báo</th><th class="n">Facebook</th><th>Trọng tâm thị trường</th><th class="n">Sự kiện</th><th>Cờ</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">Bấm một dòng để xem hồ sơ 4Ps. Số nhỏ màu cạnh "Bài web" là chênh lệch so với tuần ${esc(D.prev_week||'trước')}.</p></section>
   <div class="grid2">
    <section class="panel"><h2>Chương trình được nhắc nhiều nhất (toàn thị trường, 90 ngày)</h2>${trend}</section>
    <section class="panel"><h2>Ma trận Product: công ty × thị trường</h2><div class="scroll"><table class="heat"><thead><tr><th></th>${cols.map(k => `<th class="n" title="${esc(K[k].name)}">${K[k].flag} ${esc(K[k].name.split(' ')[0])}</th>`).join('')}</tr></thead><tbody>${heat}</tbody></table></div><p class="note">Số bài (90 ngày) nhắc tới chương trình thuộc thị trường đó. Ô đậm = đối thủ đang dồn content.</p></section>
   </div></div>`;
},
mix(){
  const dim = state.mixdim || 'type', pct = state.mixpct !== false;
  const CT = ['Hướng dẫn / Kiến thức','Tin chính sách','Câu chuyện thành công','Sự kiện / Hội thảo','So sánh / Tư vấn chọn','Dự án / Chương trình','Thương hiệu / PR'];
  let cats, val;
  if (dim === 'type'){
    cats = [...CT, 'Khác'];
    const m = {}; D.items.forEach(i => { const t = (i.ai && i.ai.content_type) || (i.ctype && i.ctype[0]) || 'Khác'; const k = CT.includes(t) ? t : 'Khác';
      (m[i.company] = m[i.company] || {})[k] = (m[i.company][k] || 0) + 1; });
    val = (id, k) => (m[id] || {})[k] || 0;
  } else if (dim === 'src'){
    cats = ['web','facebook','news'];
    const m = {}; D.items.forEach(i => { (m[i.company] = m[i.company] || {})[i.src] = (m[i.company][i.src] || 0) + 1; });
    val = (id, k) => (m[id] || {})[k] || 0;
  } else {
    cats = Object.keys(K);
    val = (id, k) => (C[id].product.countries.find(x => x[0] === k) || [0, 0])[1];
  }
  const label = k => dim === 'src' ? SRC[k] : dim === 'mkt' ? `${K[k].flag} ${K[k].name}` : k;
  const color = (k, j) => k === 'Khác' ? 'var(--s0)' : `var(--s${j + 1})`;
  const rows = ids.map(id => ({id, v: cats.map(k => val(id, k))})).map(r => ({...r, t: r.v.reduce((a, b) => a + b, 0)}))
    .filter(r => r.t).sort((a, b) => (C[b.id].self - C[a.id].self) || b.t - a.t);
  const mx = Math.max(1, ...rows.map(r => r.t));
  const bars = rows.map(r => `<div class="mrow ${C[r.id].self ? 'self' : ''}"><span class="nm" title="${esc(C[r.id].name)}">${esc(C[r.id].name)}</span>
    <div class="mbar" style="width:${pct ? 100 : Math.max(4, 100 * r.t / mx)}%">${r.v.map((n, j) => n ? `<i style="flex:${n};background:${color(cats[j], j)}" data-tip="${esc(C[r.id].name)}|${esc(label(cats[j]))}|${n}|${Math.round(100 * n / r.t)}"></i>` : '').join('')}</div>
    <span class="tt">${r.t}</span></div>`).join('');
  // Nhận xét tự động: mỗi nhóm, ai dẫn đầu về tỷ trọng; SI so với trung bình đối thủ
  const si = rows.find(r => C[r.id].self), comp = rows.filter(r => !C[r.id].self && r.t >= 5);
  const share = (r, j) => r.t ? r.v[j] / r.t : 0;
  const notes = cats.map((k, j) => { if (k === 'Khác') return '';
    const avg = comp.length ? comp.reduce((a, r) => a + share(r, j), 0) / comp.length : 0;
    const top = comp.slice().sort((a, b) => share(b, j) - share(a, j))[0];
    if (!top || !share(top, j)) return '';
    return `<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${color(k, j)};margin-right:6px"></i>${esc(label(k))}</td>
      <td class="n">${si ? Math.round(100 * share(si, j)) + '%' : '—'}</td><td class="n">${Math.round(100 * avg)}%</td><td>${esc(C[top.id].name)} <span class="sub">${Math.round(100 * share(top, j))}%</span></td></tr>`; }).join('');
  const table = state.mixtable ? `<div class="scroll"><table><thead><tr><th>Công ty</th>${cats.map(k => `<th class="n">${esc(label(k))}</th>`).join('')}<th class="n">Tổng</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="${C[r.id].self ? 'self' : ''}"><td class="name">${esc(C[r.id].name)}</td>${r.v.map(n => `<td class="n">${pct ? (r.t ? Math.round(100 * n / r.t) + '%' : '') : n}</td>`).join('')}<td class="n">${r.t}</td></tr>`).join('')}</tbody></table></div>` : '';
  const seg = (key, opts, cur) => `<div class="seg2" role="group">${opts.map(([v, l]) => `<button type="button" data-${key}="${v}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join('')}</div>`;
  const what = {type: 'loại nội dung (AI phân loại từng bài)', src: 'kênh đăng', mkt: 'thị trường được nhắc tới'}[dim];
  return `<section class="panel"><h2>So sánh nội dung giữa các công ty (90 ngày)</h2>
    <div class="ctl">${seg('mixdim', [['type', 'Loại nội dung'], ['src', 'Kênh'], ['mkt', 'Thị trường']], dim)}
      ${seg('mixpct', [['true', 'Tỷ lệ %'], ['false', 'Số bài']], pct)}
      <button type="button" class="linkbtn" data-mixtable="1">${state.mixtable ? 'Ẩn bảng số' : 'Xem bảng số'}</button></div>
    <div class="lgd">${cats.map((k, j) => `<span><i style="background:${color(k, j)}"></i>${esc(label(k))}</span>`).join('')}</div>
    <div class="mix">${bars}</div>
    <p class="note">Mỗi thanh là một công ty, chia theo ${what}. ${pct ? 'Thanh dài bằng nhau để so tỷ trọng.' : 'Độ dài thanh theo tổng số bài.'} Số bên phải = tổng ${dim === 'mkt' ? 'lượt nhắc' : 'bài'}. Rê chuột lên từng đoạn để xem số.</p>
    ${table}</section>
    <section class="panel"><h2>SI so với đối thủ theo từng nhóm</h2>
    <div class="scroll"><table><thead><tr><th>Nhóm</th><th class="n">SI</th><th class="n">TB đối thủ</th><th>Đối thủ tập trung nhất</th></tr></thead><tbody>${notes}</tbody></table></div>
    <p class="note">Tỷ trọng = phần trăm ${dim === 'mkt' ? 'lượt nhắc' : 'bài'} của công ty thuộc nhóm đó. Chỉ tính đối thủ có từ 5 ${dim === 'mkt' ? 'lượt nhắc' : 'bài'} trở lên.</p></section>`;
},
company(){
  const c = C[state.co];
  const opts = ids.map(id => `<option value="${id}" ${id===state.co?'selected':''}>${esc(C[id].name)}</option>`).join('');
  const posts = D.items.filter(i => i.company===state.co).slice(0,15).map(i => `<li><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a><span class="sub">${fmtD(i.date)} · ${srcTag(i)} ${engH(i)} · ${i.p4.map(p => `<span class="s-${p}">${p}</span>`).join(' ')}</span></li>`).join('');
  const ev = c.promotion.events.map(e => `<li><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a><span class="sub">đăng ${fmtD(e.date)}${e.when.length?' · diễn ra '+e.when.map(fmtD).join(', '):''}</span></li>`).join('');
  const risks = c.promotion.risks.map(r => `<li><span class="chip warn">${esc(r.text)}</span> <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></li>`).join('');
  return `<div style="display:grid;gap:16px">
   <div class="row"><label for="co" class="sub">Công ty</label><select id="co">${opts}</select>${c.web?`<a class="sub" href="${esc(c.web)}" target="_blank" rel="noopener">${esc(c.web.replace('https://',''))} ↗</a>`:''}</div>
   ${(() => { const a = AI && AI.companies.find(x => x.id === state.co); return a
      ? `<div class="verdict"><b>Nhận định AI</b> <span class="threat ${threatCls(a.threat)}">Cạnh tranh ${esc(a.threat)}</span><br>${esc(a.positioning)}${a.this_week ? '<br><b>Tuần này:</b> ' + esc(a.this_week) : ''}</div>`
      : `<div class="verdict"><b>Đánh giá tổng quan:</b> ${esc(c.summary)}</div>`; })()}
   <div class="p4">${p4cards(c)}</div>
   <div class="grid2">
    <section class="panel"><h2>Bài mới nhất</h2><ul class="list">${posts || '<li class="empty">Chưa có bài.</li>'}</ul></section>
    <div style="display:grid;gap:16px;align-content:start">
     <section class="panel"><h2>Sự kiện / hội thảo</h2><ul class="list">${ev || '<li class="empty">Không thấy sự kiện trong 90 ngày.</li>'}</ul></section>
     <section class="panel"><h2>Câu quảng cáo cần lưu ý</h2><ul class="list">${risks || '<li class="empty">Không phát hiện câu cam kết/đảm bảo.</li>'}</ul></section>
    </div>
   </div></div>`;
},
content(){
  const blocks = ids.filter(id => C[id].promotion.phrases.length || C[id].promotion.repeated.length).map(id => {
    const c = C[id];
    const rep = c.promotion.repeated.map(g => `<li><span>${esc(g.title)}</span><span class="sub">${g.count} bài · ${fmtD(g.first)} → ${fmtD(g.last)}</span></li>`).join('');
    return `<section class="panel"><div class="row"><h2>${esc(c.name)}</h2>${c.self?'<span class="chip self">SI</span>':''}</div>
      <h3>Cụm từ lặp lại trong tiêu đề</h3><div>${c.promotion.phrases.map(([g,n]) => `<span class="chip">“${esc(g)}” ×${n}</span>`).join('')}</div>
      ${rep ? `<h3>Chủ đề đăng nhiều lần</h3><ul class="list">${rep}</ul>` : ''}</section>`;
  }).join('');
  const mk = D.market_repeated.map(g => `<li><span>${esc(g.title)}</span><span class="sub">${g.count} bài · ${g.companies.map(x => esc(C[x]?.name||x)).join(', ')}</span></li>`).join('');
  return `<div style="display:grid;gap:16px">
    <section class="panel"><h2>Chủ đề nhiều công ty cùng đăng</h2><ul class="list">${mk || '<li class="empty">Chưa có chủ đề trùng giữa các công ty. Sẽ rõ hơn khi dữ liệu tích luỹ vài tuần.</li>'}</ul></section>
    <div class="grid2">${blocks}</div></div>`;
},
events(){
  return `<section class="panel"><h2>Lịch sự kiện / hội thảo / toạ đàm của đối thủ</h2>
   <div class="res-head" id="reshead"></div>
   <div class="scroll"><table><thead><tr><th class="n">Ngày diễn ra</th><th>Trạng thái</th><th>Công ty</th><th>Sự kiện</th><th class="n">Đăng</th></tr></thead><tbody id="frows"></tbody></table></div>
   <p class="note">Ngày diễn ra do AI đọc từ nội dung bài; bài không nêu ngày sẽ để trống.</p></section>`;
},
gap(){
  const rows = D.gap.map(g => {
    const flag = g.si_posts === 0 ? (g.si_home ? '<span class="chip warn">Có trên web, chưa có content</span>' : '<span class="chip warn">SI chưa có</span>') : `<span class="chip self">SI ${g.si_posts} bài</span>`;
    return `<tr><td class="name">${K[P[g.program].country].flag} ${esc(pn(g.program))}</td><td class="n">${g.companies.length}</td><td class="n">${g.mentions}</td><td>${flag}</td><td>${g.companies.map(esc).join(', ')}</td></tr>`;
  }).join('');
  return `<section class="panel"><h2>Đối thủ đang đẩy gì mà SI chưa (hoặc ít) làm content?</h2>
   <div class="scroll"><table><thead><tr><th>Chương trình</th><th class="n">Số đối thủ</th><th class="n">Bài đối thủ</th><th>SI</th><th>Đối thủ đang đăng</th></tr></thead><tbody>${rows}</tbody></table></div>
   <p class="note">Xếp theo số đối thủ cùng đẩy chương trình đó (90 ngày). "Có trên web, chưa có content" = trang chủ SI có nhắc nhưng không có bài viết nào gần đây.</p></section>`;
},
feed(){
  return `<div class="res-head" id="reshead"></div><div id="frows"></div>`;
}
};

const MAXR = 6;
const more = (n) => n > MAXR ? `<div class="more">+${n - MAXR} mục khác</div>` : '';
const sec = (label, body) => `<div><h3>${label}</h3>${body}</div>`;
function meters(rows){ // rows: [label, value]
  if (!rows.length) return '<span class="empty">Chưa có dữ liệu</span>';
  const mx = Math.max(1, ...rows.map(r => r[1]));
  return rows.slice(0, MAXR).map(([l, v]) => `<div class="meter"><span title="${esc(l)}">${l}</span><span class="t"><i style="width:${100*v/mx}%"></i></span><span class="v">${v}</span></div>`).join('') + more(rows.length);
}
const tags = arr => arr && arr.length ? arr.slice(0, 10).map(x => `<span class="ptag">${esc(x)}</span>`).join('') : '<span class="empty">Chưa có dữ liệu</span>';
function card(key, title, kpi, kpiLabel, body, one){
  return `<section class="pcard ${key}"><div class="phead"><span class="stamp">${key}</span><span class="pt">${title}</span><span class="pk"><b>${kpi}</b>${kpiLabel}</span></div><div class="pbody${one?' one':''}">${body}</div></section>`;
}
function p4cards(c){
  const progs = c.product.programs.filter(([,n,h]) => n||h);
  const byCountry = c.product.countries.map(([k,n]) => [`${K[k].flag} ${esc(K[k].name)}`, n]);
  const prices = aiPrices(state.co);
  const priceRows = prices.length
    ? prices.slice(0, MAXR).map(p => `<div class="prow"><span>${esc(p.program)}</span><span class="amt">${esc(p.amount)}</span>${p.note ? `<span class="nt">${esc(p.note)}</span>` : ''}</div>`).join('') + more(prices.length)
    : tags(c.price.prices);
  const offers = [...new Set([...c.price.offers, ...D.items.filter(i => i.company === state.co && i.ai).flatMap(i => i.ai.offers)])];
  const ct = c.promotion.content_types.map(([t,n]) => [esc(t), n]);
  const ph = c.promotion.phrases.map(([g,n]) => `“${g}” ×${n}`);
  return card('product', 'Sản phẩm', progs.length, 'chương trình',
      sec('Chương trình (số bài)', meters(progs.map(([p,n]) => [`${K[P[p].country].flag} ${esc(pn(p))}`, n]))) +
      sec('Theo thị trường', meters(byCountry)))
    + card('price', 'Giá & ưu đãi', prices.length || c.price.prices.length, 'mức giá',
      sec('Mức đầu tư / phí công bố', priceRows) + sec('Ưu đãi', tags(offers)))
    + card('place', 'Kênh phân phối', c.place.places.length + c.place.channels.length, 'điểm chạm',
      sec('Văn phòng / địa điểm', tags(c.place.places)) + sec('Kênh online', tags(c.place.channels)))
    + card('promotion', 'Truyền thông', c.posts + c.news + (c.fb || 0), 'bài 90 ngày (web, FB, báo)',
      sec('Loại content', meters(ct)) + sec('Thông điệp lặp lại', tags(ph)));
}
function aiPrices(cid){
  const seen = new Set();
  return D.items.filter(i => i.company === cid && i.ai).flatMap(i => i.ai.prices).filter(p => { const k = p.program + p.amount; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0,10);
}
function eventList(){
  const aiEv = D.items.filter(i => i.ai && i.ai.event).map(i => ({title: i.ai.event.name + (i.ai.event.city ? ' · ' + i.ai.event.city : ''), url: i.url, date: i.date.slice(0,10), when: i.ai.event.date ? [i.ai.event.date] : [], co: i.company, kind: i.ai.event.kind, src: i.title}));
  return (aiEv.length ? aiEv : ids.flatMap(id => C[id].promotion.events.map(e => ({...e, co:id})))).sort((a,b) => ((b.when[0]||b.date) > (a.when[0]||a.date) ? 1 : -1));
}
const fold = t => String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const SRC = {web: 'Website', facebook: 'Facebook', news: 'Báo chí'};
const fmtN = n => n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n || 0);
const engH = i => i.eng ? `<span class="eng" title="Thích · bình luận · chia sẻ">♥ ${fmtN(i.eng.likes)} · 💬 ${fmtN(i.eng.comments)} · ↗ ${fmtN(i.eng.shares)}</span>` : '';
const srcTag = i => `<span class="srct ${i.src}">${i.src === 'news' || (i.src === 'facebook' && i.outlet) ? esc(i.outlet || 'Báo') : SRC[i.src] || i.src}</span>`;
const TABS = [['ai','📋','Báo cáo tuần (AI)'],['overview','📊','Tổng quan'],['mix','📈','So sánh nội dung'],['company','🏢','Hồ sơ 4Ps'],['content','🔁','Content lặp lại'],['events','📅','Sự kiện'],['gap','🎯','SI vs Thị trường'],['feed','📰','Tất cả bài']];
const FILTERED = () => state.tab === 'events' || state.tab === 'feed';
function sideList(){ return state.tab === 'events' ? eventList() : D.items.map(i => ({co: i.company, src: i.src})); }
function renderSide(){
  const nav = TABS.filter(([k]) => k !== 'ai' || AI).map(([k, ic, l]) =>
    `<button type="button" class="opt ${state.tab===k?'on':''}" data-tab="${k}" aria-current="${state.tab===k}"><span>${ic}</span><span class="lbl">${l}</span></button>`).join('');
  let f = '';
  if (state.tab === 'company'){
    f = `<section class="facet"><h3>Công ty</h3>${ids.map(id => `<button type="button" class="opt ${id===state.co?'on':''}" data-co="${id}"><span class="lbl">${esc(C[id].name)}</span>${C[id].self?'<span class="n">SI</span>':''}</button>`).join('')}</section>`;
  } else if (FILTERED()){
    const list = sideList(), cnt = {}, scnt = {}, sel = state.fco || [];
    list.forEach(x => { cnt[x.co] = (cnt[x.co]||0) + 1; if (x.src) scnt[x.src] = (scnt[x.src]||0) + 1; });
    f = `<section class="facet"><h3>Công ty</h3>${ids.filter(id => cnt[id]).sort((a,b) => cnt[b]-cnt[a]).map(id =>
      `<label class="opt"><input type="checkbox" data-fco="${id}" ${sel.includes(id)?'checked':''}><span class="lbl">${esc(C[id].name)}</span><span class="n">${cnt[id]}</span></label>`).join('')}</section>`;
    if (state.tab === 'feed') f += `<section class="facet"><h3>Nguồn</h3>${['web','facebook','news'].filter(k => scnt[k]).map(k =>
      `<label class="opt"><input type="radio" name="src" data-fsrc="${k}" ${state.srcf===k?'checked':''}><span class="lbl">${SRC[k]}</span><span class="n">${scnt[k]}</span></label>`).join('')}
      <label class="opt"><input type="radio" name="src" data-fsrc="" ${!state.srcf?'checked':''}><span class="lbl">Tất cả nguồn</span></label></section>`;
  } else {
    f = `<section class="facet"><p class="hint">Bộ lọc công ty, nguồn và ô tìm kiếm dùng cho mục <b>Sự kiện</b> và <b>Tất cả bài</b>.</p></section>`;
  }
  document.getElementById('side').innerHTML = `<div class="side-head"><b>Mục</b>${FILTERED() ? '<button class="linkbtn" id="reset">Xóa lọc</button>' : ''}</div>
    <section class="facet">${nav}</section>${f}`;
}
function resHead(n, total){
  const h = document.getElementById('reshead'); if (!h) return;
  const chips = (state.fco || []).map(id => `<button class="fchip2" data-unco="${id}">${esc(C[id]?.name || id)}<span>×</span></button>`).join('')
    + (state.tab === 'feed' && state.srcf ? `<button class="fchip2" data-unsrc="1">${SRC[state.srcf]}<span>×</span></button>` : '')
    + (state.q ? `<button class="fchip2" data-unq="1">“${esc(state.q)}”<span>×</span></button>` : '');
  h.innerHTML = `<span class="count">${n} ${state.tab === 'events' ? 'sự kiện' : 'bài'}</span>${n < total ? `<span class="sub">/ ${total}</span>` : ''}${chips}`;
}
function matchF(x, text){
  if (state.tab === 'feed' && state.srcf && x.src && x.src !== state.srcf) return false;
  const sel = state.fco || [];
  if (sel.length && !sel.includes(x.co)) return false;
  const q = fold(state.q).trim();
  return !q || q.split(/\s+/).every(w => fold(text).includes(w));
}
function fillRows(){
  const tb = document.getElementById('frows'); if (!tb) return;
  const today = new Date().toISOString().slice(0,10);
  let rows, total;
  if (state.tab === 'events'){
    const all = eventList(); total = all.length;
    rows = all.filter(e => matchF(e, e.title + ' ' + (e.src||'') + ' ' + C[e.co].name)).map(e => { const w = e.when[0]; const up = w && w >= today;
      return `<tr><td class="n">${w?fmtD(w)+'/'+w.slice(2,4):'—'}</td><td>${e.kind==='recap'?'<span class="chip muted">bài tổng kết</span>':up?'<span class="chip self">sắp diễn ra</span>':'<span class="chip muted">đã qua</span>'}</td><td class="name">${esc(C[e.co].name)}</td><td><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></td><td class="n">${fmtD(e.date)}</td></tr>`; });
  } else {
    total = D.items.length;
    const all = D.items.filter(i => matchF({co: i.company, src: i.src}, i.title + ' ' + (i.summary||'') + ' ' + i.programs.map(pn).join(' ') + ' ' + (i.ai ? i.ai.programs.join(' ') + ' ' + i.ai.message : '') + ' ' + C[i.company]?.name));
    resHead(all.length, total);
    const lim = state.limit || 80, wk = new Date(Date.now() - 7*864e5).toISOString().slice(0,10), groups = [];
    all.slice(0, lim).forEach(i => { const d = new Date(i.date.slice(0,10)); const m = new Date(d - ((d.getUTCDay()+6)%7)*864e5).toISOString().slice(0,10);
      if (!groups.length || groups[groups.length-1][0] !== m) groups.push([m, []]); groups[groups.length-1][1].push(i); });
    const flagOf = i => { const p = i.programs[0]; return p && P[p] ? K[P[p].country].flag : ({facebook:'📘', news:'📰'}[i.src] || '🌐'); };
    const sun = m => { const d = new Date(new Date(m) - 0 + 6*864e5).toISOString().slice(0,10); return fmtD(d); };
    tb.innerHTML = groups.map(([m, its]) => `<section class="week"><h2>Tuần ${fmtD(m)} – ${sun(m)} <span class="wn">${its.length} bài</span></h2><div class="feed">${its.map(i => `<article class="item ${C[i.company]?.self?'self':''}"><div class="flag">${flagOf(i)}</div><div>
      <a class="t" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
      ${i.ai && i.ai.message ? `<p>${esc(i.ai.message)}</p>` : ''}
      <div class="imeta">${i.date.slice(0,10) >= wk ? '<span class="b new">MỚI</span>' : ''}<span class="grp">${esc(C[i.company]?.name)}</span>${srcTag(i)}<span>${fmtD(i.date)}</span>${engH(i)}
        ${i.p4.map(p => `<span class="stamp s-${p}">${p.slice(0,5)}</span>`).join(' ')}
        ${(i.ai ? [i.ai.content_type] : i.ctype).map(t => `<span class="chip">${esc(t)}</span>`).join('')}${i.risk.length?'<span class="chip warn">⚠ cam kết</span>':''}</div></div></article>`).join('')}</div></section>`).join('')
      + (all.length > lim ? `<button class="loadmore" id="loadmore">Xem thêm ${Math.min(80, all.length - lim)} bài (còn ${all.length - lim})</button>` : '')
      || '<div class="panel empty">Không có kết quả phù hợp. Bỏ bớt bộ lọc hoặc đổi từ khoá.</div>';
    return;
  }
  resHead(rows.length, total);
  tb.innerHTML = rows.join('') || '<tr><td colspan="5" class="empty">Không có kết quả phù hợp. Bỏ bớt bộ lọc hoặc đổi từ khoá.</td></tr>';
}
function render(){
  renderSide();
  document.getElementById('view').innerHTML = views[state.tab]();
  fillRows();
  save();
}
const side = document.getElementById('side'), scrim = document.getElementById('scrim');
const closeSide = () => { side.classList.remove('open'); scrim.classList.remove('open'); };
document.getElementById('fbtn').addEventListener('click', () => { side.classList.add('open'); scrim.classList.add('open'); });
scrim.addEventListener('click', closeSide);
side.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t){ state.tab = t.dataset.tab; state.limit = 0; render(); closeSide(); window.scrollTo(0,0); return; }
  const c = e.target.closest('button[data-co]'); if (c){ state.co = c.dataset.co; render(); closeSide(); return; }
  if (e.target.id === 'reset'){ state.fco = []; state.srcf = ''; state.q = ''; document.getElementById('q').value = ''; render(); }
});
side.addEventListener('change', e => {
  const x = e.target;
  if (x.dataset.fco !== undefined){ const sel = new Set(state.fco || []); x.checked ? sel.add(x.dataset.fco) : sel.delete(x.dataset.fco); state.fco = [...sel]; }
  else if (x.dataset.fsrc !== undefined){ state.srcf = x.dataset.fsrc; }
  else return;
  state.limit = 0; save(); fillRows();
});
const q = document.getElementById('q'); q.value = state.q || '';
q.addEventListener('input', () => { state.q = q.value; state.limit = 0; if (!FILTERED()){ state.tab = 'feed'; render(); q.focus(); } else { save(); fillRows(); } });
document.getElementById('view').addEventListener('click', e => {
  const r = e.target.closest('tr[data-co]'); if (r){ state.co = r.dataset.co; state.tab = 'company'; render(); window.scrollTo(0,0); return; }
  if (e.target.id === 'loadmore'){ state.limit = (state.limit || 80) + 80; fillRows(); return; }
  const u = e.target.closest('[data-unco],[data-unsrc],[data-unq]'); if (!u) return;
  if (u.dataset.unco) state.fco = (state.fco || []).filter(x => x !== u.dataset.unco);
  if (u.dataset.unsrc) state.srcf = '';
  if (u.dataset.unq){ state.q = ''; q.value = ''; }
  render();
});
const tip = document.createElement('div'); tip.id = 'tip'; tip.hidden = true; document.body.appendChild(tip);
document.getElementById('view').addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]'); if (!t){ tip.hidden = true; return; }
  const [co, cat, n, p] = t.dataset.tip.split('|');
  tip.innerHTML = `<b>${co}</b>${cat}: ${n} ${state.mixdim === 'mkt' ? 'lượt nhắc' : 'bài'} · ${p}%`; tip.hidden = false;
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});
document.getElementById('view').addEventListener('mouseleave', () => tip.hidden = true);
document.getElementById('view').addEventListener('click', e => {
  const b = e.target.closest('[data-mixdim],[data-mixpct],[data-mixtable]'); if (!b) return;
  if (b.dataset.mixdim) state.mixdim = b.dataset.mixdim;
  if (b.dataset.mixpct) state.mixpct = b.dataset.mixpct === 'true';
  if (b.dataset.mixtable) state.mixtable = !state.mixtable;
  render();
});
document.getElementById('view').addEventListener('change', e => { if (e.target.id==='co'){ state.co = e.target.value; render(); } });
if (!C[state.co]) state.co = ids[0];
if (AI) { if (!state.seenAi || state.seenAi !== AI.week) { state.tab = 'ai'; state.seenAi = AI.week; } }
if (!views[state.tab] || (state.tab === 'ai' && !AI)) state.tab = 'overview';
render();
</script>

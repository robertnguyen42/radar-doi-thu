<style>
/* Layout: header + thanh tab; mỗi tab là bảng/lưới quét nhanh. 4Ps = 4 màu "mực dấu visa". */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --sunk:#eef1f6; --line:#dbe1ea;
  --fg:#16202e; --muted:#5b6778; --accent:#1f4fa8; --accent-soft:#e3ebfa;
  --p-product:#1f4fa8; --p-price:#0f7a5a; --p-place:#8a5a00; --p-promo:#a3306b;
  --warn:#b4231f; --warn-soft:#fbe6e4; --self:#0f7a5a; --self-soft:#e1f3ec;
  --heat:31,79,168;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#161d28; --sunk:#1c2532; --line:#2a3546;
  --fg:#e6ebf2; --muted:#9aa6b8; --accent:#7ea6f2; --accent-soft:#1f2c45;
  --p-product:#7ea6f2; --p-price:#4cc59a; --p-place:#e0b049; --p-promo:#e48ab8;
  --warn:#f07a73; --warn-soft:#3a1f20; --self:#4cc59a; --self-soft:#163329; --heat:126,166,242; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#161d28; --sunk:#1c2532; --line:#2a3546;
  --fg:#e6ebf2; --muted:#9aa6b8; --accent:#7ea6f2; --accent-soft:#1f2c45;
  --p-product:#7ea6f2; --p-price:#4cc59a; --p-place:#e0b049; --p-promo:#e48ab8;
  --warn:#f07a73; --warn-soft:#3a1f20; --self:#4cc59a; --self-soft:#163329; --heat:126,166,242; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--f-body);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:16px;margin:0;font-weight:600;text-wrap:balance}
h3{font-size:12px;margin:0;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meta{color:var(--muted);font-size:12.5px;font-family:var(--f-mono)}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{font:inherit;font-weight:500;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.self td{background:var(--self-soft)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.name{font-weight:600;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);white-space:nowrap;margin:1px 2px 1px 0}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:600}
.chip.self{background:var(--self-soft);border-color:transparent;color:var(--self);font-weight:600}
.chip.muted{color:var(--muted)}
.stamp{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:1.5px solid currentColor;border-radius:3px;transform:rotate(-2deg);display:inline-block}
.s-product{color:var(--p-product)} .s-price{color:var(--p-price)} .s-place{color:var(--p-place)} .s-promotion{color:var(--p-promo)}
.p4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.pcard{--p:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-rows:auto 1fr;min-width:0;overflow:hidden}
.pcard.product{--p:var(--p-product)} .pcard.price{--p:var(--p-price)} .pcard.place{--p:var(--p-place)} .pcard.promotion{--p:var(--p-promo)}
.phead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--p) 7%,var(--surface))}
.phead .stamp{color:var(--p);flex:none}
.phead .pt{font-weight:600;font-size:15px;flex:1;min-width:0}
.phead .pk{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.phead .pk b{color:var(--p);font-size:18px;font-weight:600;display:block;line-height:1.1}
.pbody{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:14px 16px 16px;align-content:start}
.pbody > div{display:grid;gap:8px;align-content:start;min-width:0}
.pbody.one{grid-template-columns:1fr}
@media (max-width:520px){.pbody{grid-template-columns:1fr}}
.meter{display:grid;grid-template-columns:minmax(0,1fr) 64px 28px;gap:8px;align-items:center;font-size:13px}
.meter span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter .t{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter .t i{display:block;height:100%;background:var(--p);border-radius:3px}
.meter .v{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px;padding-block:5px;border-bottom:1px dashed var(--line)}
.prow:last-child{border-bottom:0}
.prow .amt{font-family:var(--f-mono);font-weight:600;color:var(--p);white-space:nowrap;font-variant-numeric:tabular-nums}
.prow .nt{grid-column:1/-1;color:var(--muted);font-size:11.5px}
.ptag{display:inline-flex;font-size:12px;padding:2px 8px;border-radius:5px;margin:0 4px 4px 0;background:color-mix(in srgb,var(--p) 10%,var(--surface));color:var(--fg);border:1px solid color-mix(in srgb,var(--p) 22%,transparent)}
.more{font-size:11.5px;color:var(--muted)}
.filter{display:grid;gap:10px}
.filter input[type=search]{font:inherit;width:100%;max-width:420px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.fchip i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.fchip[aria-pressed="true"] i{color:var(--surface)}
.fchip:hover{border-color:var(--accent)}
.fcount{font-size:12px;color:var(--muted)}
.heat td.h{text-align:center;font-family:var(--f-mono);font-size:12px;min-width:44px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 36px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:10px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:grid;gap:2px;min-width:0}
.list a{color:var(--fg);text-decoration:none} .list a:hover{color:var(--accent);text-decoration:underline}
.sub{color:var(--muted);font-size:12px}
.threat{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px}

.kv dt{font-weight:600} .kv dd{margin:0;min-width:0}
ol.actions{margin:0;padding-left:20px;display:grid;gap:10px}
.verdict{background:var(--accent-soft);border-radius:6px;padding:10px 12px;line-height:1.6;max-width:90ch}
select{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{color:var(--muted);font-size:12.5px;max-width:95ch}
.empty{color:var(--muted);font-style:italic;font-size:13px}
.big{font-size:22px;font-weight:700;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.delta{font-family:var(--f-mono);font-size:11.5px}
.up{color:var(--p-price)} .down{color:var(--warn)}
@media (prefers-reduced-motion:no-preference){nav button{transition:color .15s,border-color .15s}}
</style>

   <div class="p4">${p4cards(c)}</div>
   <div class="grid2">
    <section class="panel"><h2>Bài mới nhất</h2><ul class="list">${posts || '<li class="empty">Chưa có bài.</li>'}</ul></section>
    <div style="display:grid;gap:16px;align-content:start">
     <section class="panel"><h2>Sự kiện / hội thảo</h2><ul class="list">${ev || '<li class="empty">Không thấy sự kiện trong 90 ngày.</li>'}</ul></section>
     <section class="panel"><h2>Câu quảng cáo cần lưu ý</h2><ul class="list">${risks || '<li class="empty">Không phát hiện câu cam kết/đảm bảo.</li>'}</ul></section>
    </div>
   </div></div>`;
},
content(){
  const blocks = ids.filter(id => C[id].promotion.phrases.length || C[id].promotion.repeated.length).map(id => {
    const c = C[id];
    const rep = c.promotion.repeated.map(g => `<li><span>${esc(g.title)}</span><span class="sub">${g.count} bài · ${fmtD(g.first)} → ${fmtD(g.last)}</span></li>`).join('');
    return `<section class="panel"><div class="row"><h2>${esc(c.name)}</h2>${c.self?'<span class="chip self">SI</span>':''}</div>
      <h3>Cụm từ lặp lại trong tiêu đề</h3><div>${c.promotion.phrases.map(([g,n]) => `<span class="chip">“${esc(g)}” ×${n}</span>`).join('')}</div>
      ${rep ? `<h3>Chủ đề đăng nhiều lần</h3><ul class="list">${rep}</ul>` : ''}</section>`;
  }).join('');
  const mk = D.market_repeated.map(g => `<li><span>${esc(g.title)}</span><span class="sub">${g.count} bài · ${g.companies.map(x => esc(C[x]?.name||x)).join(', ')}</span></li>`).join('');
  return `<div style="display:grid;gap:16px">
    <section class="panel"><h2>Chủ đề nhiều công ty cùng đăng</h2><ul class="list">${mk || '<li class="empty">Chưa có chủ đề trùng giữa các công ty. Sẽ rõ hơn khi dữ liệu tích luỹ vài tuần.</li>'}</ul></section>
    <div class="grid2">${blocks}</div></div>`;
},
events(){
  return `<section class="panel"><h2>Lịch sự kiện / hội thảo / toạ đàm của đối thủ</h2>
   ${filterBar(eventList())}
   <div class="scroll"><table><thead><tr><th class="n">Ngày diễn ra</th><th>Trạng thái</th><th>Công ty</th><th>Sự kiện</th><th class="n">Đăng</th></tr></thead><tbody id="frows"></tbody></table></div>
   <p class="note">Ngày diễn ra do AI đọc từ nội dung bài; bài không nêu ngày sẽ để trống.</p></section>`;
},
gap(){
  const rows = D.gap.map(g => {
    const flag = g.si_posts === 0 ? (g.si_home ? '<span class="chip warn">Có trên web, chưa có content</span>' : '<span class="chip warn">SI chưa có</span>') : `<span class="chip self">SI ${g.si_posts} bài</span>`;
    return `<tr><td class="name">${K[P[g.program].country].flag} ${esc(pn(g.program))}</td><td class="n">${g.companies.length}</td><td class="n">${g.mentions}</td><td>${flag}</td><td>${g.companies.map(esc).join(', ')}</td></tr>`;
  }).join('');
  return `<section class="panel"><h2>Đối thủ đang đẩy gì mà SI chưa (hoặc ít) làm content?</h2>
   <div class="scroll"><table><thead><tr><th>Chương trình</th><th class="n">Số đối thủ</th><th class="n">Bài đối thủ</th><th>SI</th><th>Đối thủ đang đăng</th></tr></thead><tbody>${rows}</tbody></table></div>
   <p class="note">Xếp theo số đối thủ cùng đẩy chương trình đó (90 ngày). "Có trên web, chưa có content" = trang chủ SI có nhắc nhưng không có bài viết nào gần đây.</p></section>`;
},
feed(){
  return `<section class="panel"><h2>Tất cả bài (90 ngày)</h2>
   ${filterBar(D.items.map(i => ({...i, co: i.company})))}
   <div class="scroll"><table><thead><tr><th class="n">Ngày</th><th>Công ty</th><th>Tiêu đề</th><th>4Ps</th><th>Loại</th></tr></thead><tbody id="frows"></tbody></table></div></section>`;
}
};

const MAXR = 6;
const more = (n) => n > MAXR ? `<div class="more">+${n - MAXR} mục khác</div>` : '';
const sec = (label, body) => `<div><h3>${label}</h3>${body}</div>`;
function meters(rows){ // rows: [label, value]
  if (!rows.length) return '<span class="empty">Chưa có dữ liệu</span>';
  const mx = Math.max(1, ...rows.map(r => r[1]));
  return rows.slice(0, MAXR).map(([l, v]) => `<div class="meter"><span title="${esc(l)}">${l}</span><span class="t"><i style="width:${100*v/mx}%"></i></span><span class="v">${v}</span></div>`).join('') + more(rows.length);
}
const tags = arr => arr && arr.length ? arr.slice(0, 10).map(x => `<span class="ptag">${esc(x)}</span>`).join('') : '<span class="empty">Chưa có dữ liệu</span>';
function card(key, title, kpi, kpiLabel, body, one){
  return `<section class="pcard ${key}"><div class="phead"><span class="stamp">${key}</span><span class="pt">${title}</span><span class="pk"><b>${kpi}</b>${kpiLabel}</span></div><div class="pbody${one?' one':''}">${body}</div></section>`;
}
function p4cards(c){
  const progs = c.product.programs.filter(([,n,h]) => n||h);
  const byCountry = c.product.countries.map(([k,n]) => [`${K[k].flag} ${esc(K[k].name)}`, n]);
  const prices = aiPrices(state.co);
  const priceRows = prices.length
    ? prices.slice(0, MAXR).map(p => `<div class="prow"><span>${esc(p.program)}</span><span class="amt">${esc(p.amount)}</span>${p.note ? `<span class="nt">${esc(p.note)}</span>` : ''}</div>`).join('') + more(prices.length)
    : tags(c.price.prices);
  const offers = [...new Set([...c.price.offers, ...D.items.filter(i => i.company === state.co && i.ai).flatMap(i => i.ai.offers)])];
  const ct = c.promotion.content_types.map(([t,n]) => [esc(t), n]);
  const ph = c.promotion.phrases.map(([g,n]) => `“${g}” ×${n}`);
  return card('product', 'Sản phẩm', progs.length, 'chương trình',
      sec('Chương trình (số bài)', meters(progs.map(([p,n]) => [`${K[P[p].country].flag} ${esc(pn(p))}`, n]))) +
      sec('Theo thị trường', meters(byCountry)))
    + card('price', 'Giá & ưu đãi', prices.length || c.price.prices.length, 'mức giá',
      sec('Mức đầu tư / phí công bố', priceRows) + sec('Ưu đãi', tags(offers)))
    + card('place', 'Kênh phân phối', c.place.places.length + c.place.channels.length, 'điểm chạm',
      sec('Văn phòng / địa điểm', tags(c.place.places)) + sec('Kênh online', tags(c.place.channels)))
    + card('promotion', 'Truyền thông', c.posts + c.news, 'bài 90 ngày',
      sec('Loại content', meters(ct)) + sec('Thông điệp lặp lại', tags(ph)));
}
function aiPrices(cid){
  const seen = new Set();
  return D.items.filter(i => i.company === cid && i.ai).flatMap(i => i.ai.prices).filter(p => { const k = p.program + p.amount; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0,10);
}
function eventList(){
  const aiEv = D.items.filter(i => i.ai && i.ai.event).map(i => ({title: i.ai.event.name + (i.ai.event.city ? ' · ' + i.ai.event.city : ''), url: i.url, date: i.date.slice(0,10), when: i.ai.event.date ? [i.ai.event.date] : [], co: i.company, kind: i.ai.event.kind, src: i.title}));
  return (aiEv.length ? aiEv : ids.flatMap(id => C[id].promotion.events.map(e => ({...e, co:id})))).sort((a,b) => ((b.when[0]||b.date) > (a.when[0]||a.date) ? 1 : -1));
}
const fold = t => String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
function filterBar(list){
  const cnt = {}; list.forEach(x => cnt[x.co] = (cnt[x.co]||0) + 1);
  const sel = new Set(state.fco || []);
  const chipsH = `<button type="button" class="fchip" data-fco="" aria-pressed="${sel.size===0}">Tất cả <i>${list.length}</i></button>` +
    ids.filter(id => cnt[id]).map(id => `<button type="button" class="fchip" data-fco="${id}" aria-pressed="${sel.has(id)}">${esc(C[id].name)} <i>${cnt[id]}</i></button>`).join('');
  return `<div class="filter"><label class="sub" for="fq">Tìm kiếm</label><input id="fq" type="search" placeholder="Gõ từ khoá: EB-5, Hy Lạp, hội thảo…" value="${esc(state.q||'')}" autocomplete="off">
    <div class="fchips" role="group" aria-label="Lọc theo công ty">${chipsH}</div><span class="fcount" id="fcount"></span></div>`;
}
function matchF(x, text){
  const sel = state.fco || [];
  if (sel.length && !sel.includes(x.co)) return false;
  const q = fold(state.q).trim();
  return !q || q.split(/\s+/).every(w => fold(text).includes(w));
}
function fillRows(){
  const tb = document.getElementById('frows'); if (!tb) return;
  const today = new Date().toISOString().slice(0,10);
  let rows, total;
  if (state.tab === 'events'){
    const all = eventList(); total = all.length;
    rows = all.filter(e => matchF(e, e.title + ' ' + (e.src||'') + ' ' + C[e.co].name)).map(e => { const w = e.when[0]; const up = w && w >= today;
      return `<tr><td class="n">${w?fmtD(w)+'/'+w.slice(2,4):'—'}</td><td>${e.kind==='recap'?'<span class="chip muted">bài tổng kết</span>':up?'<span class="chip self">sắp diễn ra</span>':'<span class="chip muted">đã qua</span>'}</td><td class="name">${esc(C[e.co].name)}</td><td><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></td><td class="n">${fmtD(e.date)}</td></tr>`; });
  } else {
    total = D.items.length;
    rows = D.items.filter(i => matchF({co: i.company}, i.title + ' ' + i.programs.map(pn).join(' ') + ' ' + (i.ai ? i.ai.programs.join(' ') + ' ' + i.ai.message : '') + ' ' + C[i.company]?.name)).map(i => `<tr><td class="n">${fmtD(i.date)}</td><td class="name">${esc(C[i.company]?.name)}</td><td><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a><div class="sub">${esc(i.ai && i.ai.message ? i.ai.message : i.programs.map(pn).join(' · '))}</div></td><td>${i.p4.map(p => `<span class="stamp s-${p}">${p.slice(0,5)}</span>`).join(' ')}</td><td>${(i.ai ? [i.ai.content_type] : i.ctype).map(t => `<span class="chip">${esc(t)}</span>`).join('')}${i.risk.length?'<span class="chip warn">⚠</span>':''}</td></tr>`);
  }
  tb.innerHTML = rows.join('') || '<tr><td colspan="5" class="empty">Không có kết quả phù hợp. Bỏ bớt bộ lọc hoặc đổi từ khoá.</td></tr>';
  const fc = document.getElementById('fcount'); if (fc) fc.textContent = `Hiển thị ${rows.length} / ${total}`;
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab===state.tab));
  document.getElementById('view').innerHTML = views[state.tab]();
  fillRows();
  save();
}
document.getElementById('tabs').addEventListener('click', e => { const t = e.target.closest('button'); if (t){ state.tab = t.dataset.tab; render(); } });
document.getElementById('view').addEventListener('click', e => { const r = e.target.closest('tr[data-co]'); if (r){ state.co = r.dataset.co; state.tab = 'company'; render(); window.scrollTo(0,0); } });
document.getElementById('view').addEventListener('change', e => { if (e.target.id==='co'){ state.co = e.target.value; render(); } });
document.getElementById('view').addEventListener('click', e => {
  const b = e.target.closest('[data-fco]'); if (!b) return;
  const id = b.dataset.fco; let sel = state.fco || [];
  sel = id === '' ? [] : sel.includes(id) ? sel.filter(x => x !== id) : [...sel, id];
  state.fco = sel; save();
  document.querySelectorAll('.fchip').forEach(c => c.setAttribute('aria-pressed', c.dataset.fco === '' ? sel.length === 0 : sel.includes(c.dataset.fco)));
  fillRows();
});
document.getElementById('view').addEventListener('input', e => { if (e.target.id === 'fq'){ state.q = e.target.value; save(); fillRows(); } });
if (!C[state.co]) state.co = ids[0];
if (AI) { document.getElementById('tab-ai').hidden = false; if (!state.seenAi || state.seenAi !== AI.week) { state.tab = 'ai'; state.seenAi = AI.week; } }
if (!views[state.tab] || (state.tab === 'ai' && !AI)) state.tab = 'overview';
render();
</script>

    <section class="pcard"><span class="stamp s-price">Price</span><h3>Mức giá / đầu tư công bố</h3><div>${(() => { const ps = aiPrices(state.co); return ps.length ? ps.map(p => `<span class="chip" title="${esc(p.note)}">${esc(p.program)}: <b>${esc(p.amount)}</b></span>`).join('') : chips(c.price.prices); })()}</div><h3>Ưu đãi</h3><div>${chips(c.price.offers)}</div></section>
    <section class="pcard"><span class="stamp s-place">Place</span><h3>Địa điểm / văn phòng</h3><div>${chips(c.place.places)}</div><h3>Kênh</h3><div>${chips(c.place.channels)}</div></section>
    <section class="pcard"><span class="stamp s-promotion">Promotion</span><h3>Loại content</h3><div>${c.promotion.content_types.map(([t,n]) => `<span class="chip">${esc(t)} <b>${n}</b></span>`).join('') || '<span class="empty">—</span>'}</div><h3>Thông điệp lặp lại</h3><div>${c.promotion.phrases.map(([g,n]) => `<span class="chip">“${esc(g)}” ×${n}</span>`).join('') || '<span class="empty">—</span>'}</div></section>
   </div>
   <div class="grid2">
    <section class="panel"><h2>Bài mới nhất</h2><ul class="list">${posts || '<li class="empty">Chưa có bài.</li>'}</ul></section>
    <div style="display:grid;gap:16px;align-content:start">
     <section class="panel"><h2>Sự kiện / hội thảo</h2><ul class="list">${ev || '<li class="empty">Không thấy sự kiện trong 90 ngày.</li>'}</ul></section>
     <section class="panel"><h2>Câu quảng cáo cần lưu ý</h2><ul class="list">${risks || '<li class="empty">Không phát hiện câu cam kết/đảm bảo.</li>'}</ul></section>
    </div>
   </div></div>`;
},
content(){
  const blocks = ids.filter(id => C[id].promotion.phrases.length || C[id].promotion.repeated.length).map(id => {
    const c = C[id];
    const rep = c.promotion.repeated.map(g => `<li><span>${esc(g.title)}</span><span class="sub">${g.count} bài · ${fmtD(g.first)} → ${fmtD(g.last)}</span></li>`).join('');
    return `<section class="panel"><div class="row"><h2>${esc(c.name)}</h2>${c.self?'<span class="chip self">SI</span>':''}</div>
      <h3>Cụm từ lặp lại trong tiêu đề</h3><div>${c.promotion.phrases.map(([g,n]) => `<span class="chip">“${esc(g)}” ×${n}</span>`).join('')}</div>
      ${rep ? `<h3>Chủ đề đăng nhiều lần</h3><ul class="list">${rep}</ul>` : ''}</section>`;
  }).join('');
  const mk = D.market_repeated.map(g => `<li><span>${esc(g.title)}</span><span class="sub">${g.count} bài · ${g.companies.map(x => esc(C[x]?.name||x)).join(', ')}</span></li>`).join('');
  return `<div style="display:grid;gap:16px">
    <section class="panel"><h2>Chủ đề nhiều công ty cùng đăng</h2><ul class="list">${mk || '<li class="empty">Chưa có chủ đề trùng giữa các công ty. Sẽ rõ hơn khi dữ liệu tích luỹ vài tuần.</li>'}</ul></section>
    <div class="grid2">${blocks}</div></div>`;
},
events(){
  const aiEv = D.items.filter(i => i.ai && i.ai.event).map(i => ({title: i.ai.event.name + (i.ai.event.city ? ' · ' + i.ai.event.city : ''), url: i.url, date: i.date.slice(0,10), when: i.ai.event.date ? [i.ai.event.date] : [], co: i.company, kind: i.ai.event.kind}));
  const ev = (aiEv.length ? aiEv : ids.flatMap(id => C[id].promotion.events.map(e => ({...e, co:id})))).sort((a,b) => ((b.when[0]||b.date) > (a.when[0]||a.date) ? 1 : -1));
  const today = new Date().toISOString().slice(0,10);
  const rows = ev.map(e => { const w = e.when[0]; const up = w && w >= today;
    return `<tr><td class="n">${w?fmtD(w)+'/'+w.slice(2,4):'—'}</td><td>${e.kind==='recap'?'<span class="chip muted">bài tổng kết</span>':up?'<span class="chip self">sắp diễn ra</span>':'<span class="chip muted">đã qua</span>'}</td><td class="name">${esc(C[e.co].name)}</td><td><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></td><td class="n">${fmtD(e.date)}</td></tr>`; }).join('');
  return `<section class="panel"><h2>Lịch sự kiện / hội thảo / toạ đàm của đối thủ</h2>
   <div class="scroll"><table><thead><tr><th class="n">Ngày diễn ra</th><th>Trạng thái</th><th>Công ty</th><th>Sự kiện</th><th class="n">Đăng</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="empty">Chưa có sự kiện.</td></tr>'}</tbody></table></div>
   <p class="note">Ngày diễn ra được đọc tự động từ nội dung bài (dd/mm), có thể sai với bài nhắc nhiều mốc ngày.</p></section>`;
},
gap(){
  const rows = D.gap.map(g => {
    const flag = g.si_posts === 0 ? (g.si_home ? '<span class="chip warn">Có trên web, chưa có content</span>' : '<span class="chip warn">SI chưa có</span>') : `<span class="chip self">SI ${g.si_posts} bài</span>`;
    return `<tr><td class="name">${K[P[g.program].country].flag} ${esc(pn(g.program))}</td><td class="n">${g.companies.length}</td><td class="n">${g.mentions}</td><td>${flag}</td><td>${g.companies.map(esc).join(', ')}</td></tr>`;
  }).join('');
  return `<section class="panel"><h2>Đối thủ đang đẩy gì mà SI chưa (hoặc ít) làm content?</h2>
   <div class="scroll"><table><thead><tr><th>Chương trình</th><th class="n">Số đối thủ</th><th class="n">Bài đối thủ</th><th>SI</th><th>Đối thủ đang đăng</th></tr></thead><tbody>${rows}</tbody></table></div>
   <p class="note">Xếp theo số đối thủ cùng đẩy chương trình đó (90 ngày). "Có trên web, chưa có content" = trang chủ SI có nhắc nhưng không có bài viết nào gần đây.</p></section>`;
},
feed(){
  const rows = D.items.slice(0,250).map(i => `<tr><td class="n">${fmtD(i.date)}</td><td class="name">${esc(C[i.company]?.name)}</td><td><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a><div class="sub">${i.programs.map(pn).map(esc).join(' · ')}</div></td><td>${i.p4.map(p => `<span class="stamp s-${p}">${p.slice(0,5)}</span>`).join(' ')}</td><td>${i.ctype.map(t => `<span class="chip">${esc(t)}</span>`).join('')}${i.risk.length?'<span class="chip warn">⚠</span>':''}</td></tr>`).join('');
  return `<section class="panel"><h2>Tất cả bài (90 ngày)</h2><div class="scroll"><table><thead><tr><th class="n">Ngày</th><th>Công ty</th><th>Tiêu đề</th><th>4Ps</th><th>Loại</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
};

function aiPrices(cid){
  const seen = new Set();
  return D.items.filter(i => i.company === cid && i.ai).flatMap(i => i.ai.prices).filter(p => { const k = p.program + p.amount; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0,10);
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab===state.tab));
  document.getElementById('view').innerHTML = views[state.tab]();
  save();
}
document.getElementById('tabs').addEventListener('click', e => { const t = e.target.closest('button'); if (t){ state.tab = t.dataset.tab; render(); } });
document.getElementById('view').addEventListener('click', e => { const r = e.target.closest('tr[data-co]'); if (r){ state.co = r.dataset.co; state.tab = 'company'; render(); window.scrollTo(0,0); } });
document.getElementById('view').addEventListener('change', e => { if (e.target.id==='co'){ state.co = e.target.value; render(); } });
if (!C[state.co]) state.co = ids[0];
if (AI) { document.getElementById('tab-ai').hidden = false; if (!state.seenAi || state.seenAi !== AI.week) { state.tab = 'ai'; state.seenAi = AI.week; } }
if (!views[state.tab] || (state.tab === 'ai' && !AI)) state.tab = 'overview';
render();
</script>
